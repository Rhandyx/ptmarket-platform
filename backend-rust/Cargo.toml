[package]
name = "ptmarket-api"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "ptmarket-api"

[lib]
name = "ptmarket_api"
path = "src/lib.rs"

[[bin]]
name = "ptmarket-api"
path = "src/main.rs"

[[bin]]
name = "openapi"
path = "src/bin/openapi.rs"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "macros", "migrate"] }
deadpool-redis = "=0.23.1"
secrecy = "=0.10.3"
utoipa = "=6.0.0"
tower = "=0.5.3"
tower-http = { version = "=0.7.1", features = ["request-id", "trace", "timeout", "limit", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
anyhow = "=1.0.105"
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.3", features = ["v7", "serde"] }
async-trait = "=0.1.92"
regex = "=1.13.1"
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std"] }
argon2 = { version = "=0.6.0", features = ["zeroize"] }
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.2", default-features = false }
ipnet = "=2.12.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
zeroize = { version = "=1.9.2", features = ["std"] }

[features]
# Construtores só para testes (ex.: TenantId::for_tests); ligado apenas pela dev-dependency abaixo,
# por isso `cargo build --release` nunca o tem.
test-support = []

[dev-dependencies]
ptmarket-api = { path = ".", features = ["test-support"] }
http-body-util = "0.1"
proptest = "=1.12.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
