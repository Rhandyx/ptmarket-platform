name: ptmarket-dev
services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: ptmarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres}
      PTM_MIGRATOR_PASSWORD: ${PTM_MIGRATOR_PASSWORD:-dev_migrator}
      PTM_APP_PASSWORD: ${PTM_APP_PASSWORD:-dev_app}
      PTM_WORKER_PASSWORD: ${PTM_WORKER_PASSWORD:-dev_worker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ptmarket"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
  redisdata:
